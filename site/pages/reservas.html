<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservas — SABORYA</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="../index.html" class="site-logo">SABOR<span>YA</span></a>
      <nav class="main-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="restaurantes.html">Restaurantes</a></li>
          <li><a href="menu.html">Menú</a></li>
          <li><a href="ofertas.html">Ofertas</a></li>
          <li><a href="reservas.html" class="active">Reservas</a></li>
          <li><a href="pedido.html">Pedido</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="section">
        <h2 class="section-title">Reserva tu mesa</h2>
        <p style="text-align:center; margin-bottom:1.5rem;">Completa el formulario para reservar tu mesa. Recibirás una confirmación al correo electrónico registrado.</p>

        <form class="form" onsubmit="event.preventDefault(); alert('Funcionalidad disponible en la entrega final con Spring Boot.');">
          <div class="form-row two-cols">
            <div>
              <label class="form-label" for="nombre">Nombre completo</label>
              <input class="form-input" id="nombre" name="nombre" type="text" required placeholder="Ej. Juan Pérez" />
            </div>
            <div>
              <label class="form-label" for="telefono">Teléfono</label>
              <input class="form-input" id="telefono" name="telefono" type="tel" required placeholder="0991234567" />
            </div>
          </div>

          <div class="form-row">
            <label class="form-label" for="email">Correo electrónico</label>
            <input class="form-input" id="email" name="email" type="email" required placeholder="correo@ejemplo.com" />
          </div>

          <div class="form-row two-cols">
            <div>
              <label class="form-label" for="restaurante">Restaurante</label>
              <select class="form-select" id="restaurante" name="restaurante" required>
                <option value="">-- Seleccione --</option>
                <option>Pizzería Luna</option>
                <option>Burger House</option>
                <option>Sushi Ko</option>
                <option>Tacos El Patrón</option>
                <option>Green Bowl</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="personas">Número de personas</label>
              <input class="form-input" id="personas" name="personas" type="number" min="1" max="20" value="2" required />
            </div>
          </div>

          <div class="form-row two-cols">
            <div>
              <label class="form-label" for="fecha">Fecha</label>
              <input class="form-input" id="fecha" name="fecha" type="date" required />
            </div>
            <div>
              <label class="form-label" for="hora">Hora</label>
              <input class="form-input" id="hora" name="hora" type="time" required />
            </div>
          </div>

          <div class="form-row">
            <label class="form-label" for="observaciones">Observaciones (opcional)</label>
            <textarea class="form-textarea" id="observaciones" name="observaciones" placeholder="Ej. Mesa cerca de la ventana, celebración de cumpleaños..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Confirmar reserva</button>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">&copy; 2026 SABORYA. Proyecto académico — Diseño de la plataforma WEB.</div>
    </div>
  </footer>
</body>
</html>
