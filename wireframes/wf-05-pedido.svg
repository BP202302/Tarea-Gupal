<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="Arial, sans-serif" font-size="14">
  <rect width="800" height="700" fill="#f5f5f5"/>
  <rect x="20" y="20" width="760" height="60" fill="#fff" stroke="#333"/>
  <text x="40" y="55" font-weight="bold">LOGO SABORYA</text>
  <text x="220" y="55">Inicio | Restaurantes | Menú | Ofertas | Reservas | Pedido | Contacto</text>

  <text x="40" y="120" font-size="20" font-weight="bold">Tu pedido</text>

  <rect x="40" y="140" width="720" height="350" fill="#fff" stroke="#333"/>

  <!-- Encabezado tabla -->
  <rect x="40" y="140" width="720" height="40" fill="#FFF8F0"/>
  <text x="60"  y="165" font-weight="bold">Producto</text>
  <text x="350" y="165" font-weight="bold">Cantidad</text>
  <text x="500" y="165" font-weight="bold">Precio</text>
  <text x="650" y="165" font-weight="bold">Subtotal</text>

  <!-- Filas -->
  <line x1="40" y1="200" x2="760" y2="200" stroke="#ddd"/>
  <text x="60"  y="225">Pizza Margarita</text>
  <text x="370" y="225">1</text>
  <text x="500" y="225">$8.50</text>
  <text x="650" y="225">$8.50</text>

  <line x1="40" y1="250" x2="760" y2="250" stroke="#ddd"/>
  <text x="60"  y="275">Burger Clásica</text>
  <text x="370" y="275">2</text>
  <text x="500" y="275">$6.00</text>
  <text x="650" y="275">$12.00</text>

  <line x1="40" y1="300" x2="760" y2="300" stroke="#ddd"/>
  <text x="60"  y="325">Limonada natural</text>
  <text x="370" y="325">2</text>
  <text x="500" y="325">$2.00</text>
  <text x="650" y="325">$4.00</text>

  <!-- Totales -->
  <line x1="40" y1="350" x2="760" y2="350" stroke="#ddd"/>
  <text x="500" y="380">Subtotal</text>
  <text x="650" y="380">$24.50</text>

  <text x="500" y="410">Envío</text>
  <text x="650" y="410">$1.50</text>

  <line x1="40" y1="430" x2="760" y2="430" stroke="#ddd"/>
  <text x="500" y="460" font-weight="bold">TOTAL</text>
  <text x="650" y="460" font-weight="bold" fill="#E63946">$26.00</text>

  <!-- Botones -->
  <rect x="440" y="510" width="150" height="40" fill="#fff" stroke="#E63946"/>
  <text x="515" y="535" text-anchor="middle" fill="#E63946" font-weight="bold">Seguir pidiendo</text>

  <rect x="610" y="510" width="150" height="40" fill="#E63946"/>
  <text x="685" y="535" text-anchor="middle" fill="#fff" font-weight="bold">Ir a pagar</text>

  <rect x="20" y="620" width="760" height="60" fill="#1D1D1D"/>
  <text x="400" y="655" text-anchor="middle" fill="#fff">&#169; 2026 SABORYA</text>
</svg>
